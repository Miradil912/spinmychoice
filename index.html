  };
  for (let lang in MESSAGE_TEMPLATES) {
    for (let cat of ['decision','health','personal','inspirational']) {
      if (!MESSAGE_TEMPLATES[lang][cat]) MESSAGE_TEMPLATES[lang][cat] = MESSAGE_TEMPLATES.en[cat];
    }
  }
  function getRandomMessage(category, lang) {
    const t = MESSAGE_TEMPLATES[lang] || MESSAGE_TEMPLATES.en;
    const catData = t[category] || MESSAGE_TEMPLATES.en[category];
    const actions = catData.actions;
    const objects = catData.objects;
    const action = actions[Math.floor(Math.random() * actions.length)];
    const obj = objects[Math.floor(Math.random() * objects.length)];
    let msg = `${action} ${obj}`;
    if (category === 'inspirational' && lang === 'en') msg = `${action} ${obj}`;
    return msg.charAt(0).toUpperCase() + msg.slice(1);
  }

  const uiTranslations = {
    en: { categoryLabels: ['Life Decision','Health','Personal','Inspirational'], spinResultPrefix: '✨ Result ✨', dailyText: 'Spins today', spinAgain: 'Spin Again' },
    es: { categoryLabels: ['Decisión','Salud','Personal','Inspiración'], spinResultPrefix: '✨ Resultado ✨', dailyText: 'Giros hoy', spinAgain: 'Girar de nuevo' },
    fr: { categoryLabels: ['Décision','Santé','Personnel','Inspiration'], spinResultPrefix: '✨ Résultat ✨', dailyText: 'Tours aujourd’hui', spinAgain: 'Rejouer' },
    de: { categoryLabels: ['Entscheidung','Gesundheit','Persönlich','Inspiration'], spinResultPrefix: '✨ Ergebnis ✨', dailyText: 'Spins heute', spinAgain: 'Nochmal drehen' },

  };

  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const categories = ['decision', 'health', 'personal', 'inspirational'];
  const colors = ['#f97316', '#10b981', '#8b5cf6', '#ec489a'];
  let currentAngle = 0;
  let spinning = false;
  let spinRequestId = null;

  function drawWheel() {
    const size = canvas.width;
    const angleStep = (Math.PI * 2) / categories.length;
    for (let i = 0; i < categories.length; i++) {
      const start = i * angleStep + currentAngle;
      const end = start + angleStep;
      ctx.beginPath();
      ctx.moveTo(size/2, size/2);
      ctx.arc(size/2, size/2, size/2, start, end);
      ctx.fillStyle = colors[i];
      ctx.fill();
      ctx.save();
      ctx.translate(size/2, size/2);
      ctx.rotate(start + angleStep/2);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${size * 0.05}px "Inter"`;
      const label = uiTranslations[currentLang]?.categoryLabels[i] || categories[i];
      ctx.fillText(label, size * 0.32, 8);
      ctx.restore();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(size/2, size/2);
      ctx.arc(size/2, size/2, size/2, start, end);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(size/2, size/2, 12, 0, 2*Math.PI);
    ctx.fillStyle = '#1e293b';
    ctx.fill();
    ctx.fillStyle = 'gold';
    ctx.beginPath();
    ctx.moveTo(size/2 + 10, size/2 - 20);
    ctx.lineTo(size/2, size/2 - 32);
    ctx.lineTo(size/2 - 10, size/2 - 20);
    ctx.fill();
  }
  function rotateWheel(angleRad) { currentAngle = angleRad % (Math.PI*2); drawWheel(); }

  function playBeep() {
    if (!soundEnabled) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = 880;
      gainNode.gain.value = 0.2;
      oscillator.type = 'sine';
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
      oscillator.stop(audioCtx.currentTime + 0.3);
    } catch(e) { console.log("audio context failed", e); }
  }

    const spinRounds = 8 + Math.random() * 8;
    const targetDeg = Math.random() * 360;
    const finalAngleRad = (targetDeg * Math.PI/180);
    const startAngle = currentAngle;
    const totalDelta = (spinRounds * 2 * Math.PI) + finalAngleRad;
    const duration = 2000;
    const startTime = performance.now();
    spinning = true;
    function step(now) {
      const elapsed = now - startTime;
      let t = Math.min(1, elapsed / duration);
      const easeOut = 1 - Math.pow(1 - t, 3);
      const newAngle = startAngle + totalDelta * easeOut;
      rotateWheel(newAngle);
      if (t < 1) spinRequestId = requestAnimationFrame(step);
      else {
        spinning = false;
        cancelAnimationFrame(spinRequestId);
        const pointerAngle = (Math.PI * 1.5) % (Math.PI*2);
        let finalRotation = newAngle % (Math.PI*2);
        let raw = (pointerAngle - finalRotation + 2*Math.PI) % (2*Math.PI);
        let idx = Math.floor(raw / ((2*Math.PI)/categories.length)) % categories.length;
        const landedCategory = categories[idx];
        const msg = getRandomMessage(landedCategory, currentLang);
        currentResult = { category: landedCategory, message: msg };
        document.getElementById('resultMessage').innerHTML = msg;
        const catLabel = uiTranslations[currentLang]?.categoryLabels[categories.indexOf(landedCategory)] || landedCategory;
        document.getElementById('categoryLabel').innerHTML = `<i class="fas fa-circle" style="color:${colors[idx]}"></i> ${catLabel}`;
        if (soundEnabled) playBeep();
        updateDailyCounter();
        document.getElementById('resultMessage').classList.add('fade-in');
        setTimeout(()=> document.getElementById('resultMessage').classList.remove('fade-in'), 400);
        document.getElementById('wheelWrapper').classList.add('wheel-hidden');
        document.getElementById('spinAgainBtn').style.display = 'inline-flex';
        document.getElementById('spinButton').style.display = 'none';
      }
    }
    spinRequestId = requestAnimationFrame(step);
  }

  function resetAndShowWheel() {
    document.getElementById('wheelWrapper').classList.remove('wheel-hidden');
    document.getElementById('spinButton').style.display = 'inline-flex';
    document.getElementById('spinAgainBtn').style.display = 'none';
    document.getElementById('resultMessage').innerHTML = '✨ Spin to reveal ✨';
    document.getElementById('categoryLabel').innerHTML = 'Your message';
    currentResult = { category: '', message: '' };
  }

  let dailyCount = parseInt(localStorage.getItem('dailySpins')||'0');
  let lastDate = localStorage.getItem('lastSpinDate');
  function updateDailyCounter() {
    const today = new Date().toDateString();
    if(lastDate !== today) { dailyCount = 0; localStorage.setItem('lastSpinDate',today); }
    dailyCount++;
    localStorage.setItem('dailySpins',dailyCount);
    document.getElementById('dailySpinCounter').innerHTML = `🎡 ${uiTranslations[currentLang]?.dailyText || 'Spins today'}: ${dailyCount} / ∞`;
  }

  async function captureResultCard() {
    const card = document.getElementById('resultCard');
    const originalOverflow = card.style.overflow;
    card.style.overflow = 'visible';
    const canvasImg = await html2canvas(card, { scale: 2, backgroundColor: getComputedStyle(document.body).getPropertyValue('--surface') });
    card.style.overflow = originalOverflow;
    return canvasImg;
  }
  document.getElementById('downloadPngBtn').onclick = async () => {
    const canvasImg = await captureResultCard();
    const link = document.createElement('a');
    link.download = `life-spin-${Date.now()}.png`;
    link.href = canvasImg.toDataURL();
    link.click();
  };
  document.getElementById('downloadPdfBtn').onclick = async () => {
    const canvasImg = await captureResultCard();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const imgData = canvasImg.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 15, 15, 180, 100);
    pdf.save(`life-spin-${Date.now()}.pdf`);
  };
  document.getElementById('shareBtn').onclick = () => {
    if (currentResult.message) {
      if (navigator.share) {
        navigator.share({ title: 'Life Spin', text: currentResult.message }).catch(() => alert('Share cancelled'));
      } else {
        navigator.clipboard.writeText(currentResult.message).then(() => alert('Message copied to clipboard!')).catch(() => alert('Could not share'));
      }
    } else { alert('Spin the wheel first!'); }
  };
  document.getElementById('speakBtn').onclick = () => {
    if (!currentResult.message) { alert('Spin first!'); return; }
    const utterance = new SpeechSynthesisUtterance(currentResult.message);
    utterance.lang = currentLang;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  };
  document.getElementById('favoriteBtn').onclick = () => {
    if (!currentResult.message) { alert('No result yet'); return; }
    let favs = JSON.parse(localStorage.getItem('favMessages')||'[]');
    favs.push({msg:currentResult.message, date:new Date().toISOString()});
    localStorage.setItem('favMessages',JSON.stringify(favs.slice(-20)));
    alert('Saved to favorites (localStorage)');
  };
  document.getElementById('donateBtn').onclick = () => window.open('https://ko-fi.com','_blank');
  document.getElementById('premiumMockBtn').onclick = () => alert('✨ Premium Spin unlocks exclusive categories. Integration ready with Stripe/PayPal.');
  document.getElementById('affiliateLink').onclick = (e) => { e.preventDefault(); alert('Wellness shop (affiliate) - replace with your link'); };
  document.getElementById('spinButton').onclick = () => spinWheel();
  document.getElementById('spinAgainBtn').onclick = () => resetAndShowWheel();
  document.getElementById('darkModeToggle').onclick = () => { document.body.classList.toggle('dark'); localStorage.setItem('lifeSpinDark',document.body.classList.contains('dark')); };
  document.getElementById('soundToggleBtn').onclick = () => { soundEnabled = !soundEnabled; localStorage.setItem('lifeSpinSound', soundEnabled); document.getElementById('soundToggleBtn').innerHTML = `<i class="fas ${soundEnabled ? 'fa-volume-up' : 'fa-volume-mute'}"></i> ${soundEnabled ? 'Sound' : 'Mute'}`; };
  function populateLanguages() {
    const sel = document.getElementById('languageSwitcher');
    sel.innerHTML = '';
    for(let [code,name] of Object.entries(LANGUAGES)) {
      let opt = document.createElement('option'); opt.value = code; opt.textContent = name; if(code===currentLang) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.onchange = (e) => { currentLang = e.target.value; localStorage.setItem('lifeSpinLang', currentLang); drawWheel(); if(currentResult.category) { currentResult.message = getRandomMessage(currentResult.category, currentLang); document.getElementById('resultMessage').innerHTML = currentResult.message; } updateDailyCounter(); document.getElementById('spinAgainBtn').innerHTML = `<i class="fas fa-redo-alt"></i> ${uiTranslations[currentLang]?.spinAgain || 'Spin Again'}`; };
  }
  function init() {
    if(darkMode) document.body.classList.add('dark');
    populateLanguages();
    drawWheel();
    updateDailyCounter();
    const savedSound = localStorage.getItem('lifeSpinSound');
    if(savedSound !== null) soundEnabled = savedSound === 'true';
    document.getElementById('soundToggleBtn').innerHTML = `<i class="fas ${soundEnabled ? 'fa-volume-up' : 'fa-volume-mute'}"></i> ${soundEnabled ? 'Sound' : 'Mute'}`;
    document.getElementById('spinAgainBtn').innerHTML = `<i class="fas fa-redo-alt"></i> ${uiTranslations[currentLang]?.spinAgain || 'Spin Again'}`;
    // (Optional) Load AdSense script if you have the real client ID – uncomment when ready
    // const adsenseScript = document.createElement('script');
    // adsenseScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
    // adsenseScript.async = true;
    // document.head.appendChild(adsenseScript);
  }
  init();
</script>
